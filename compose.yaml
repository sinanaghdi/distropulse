services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: distropulse
      POSTGRES_USER: distropulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - distropulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distropulse -d distropulse"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://distropulse:${POSTGRES_PASSWORD:-local-development-only}@db:5432/distropulse
      DISTROPULSE_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  distropulse-postgres:
